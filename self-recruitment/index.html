<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4d86ff">
<title>深圳普高自主招生选校</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app fixed">
  <header><span id="viewTitle">自主招生</span><button class="rule-btn" id="openRules">规则说明</button></header>
  <nav class="nav" id="nav">
    <button data-view="zzzs" class="active">自主招生</button>
    <button data-view="scores">录取分数线</button>
    <button data-view="fee">收费标准</button>
  </nav>

  <div class="view" id="view-zzzs">
  <div class="panel">
    <div class="seg" id="categorySeg">
      <button data-v="一类" class="active">一类自主招生</button>
      <button data-v="二类">二类自主招生</button>
    </div>
    <div class="tabs" id="trackTabs"></div>
    <div class="chips" id="subjectChips"></div>
    <div class="filters">
      <select id="ownership">
        <option value="">公办+民办</option>
        <option value="公办">公办</option>
        <option value="民办">民办</option>
      </select>
      <select id="district"><option value="">全部区域</option></select>
      <select id="boarding"><option value="">住宿不限</option></select>
      <select id="zzzsSort"></select>
      <input id="myScore" type="number" inputmode="numeric" placeholder="我的中考分">
      <label class="reach-check"><input id="onlyReach" type="checkbox">只看达到我的分数</label>
    </div>
    <div class="filter-tags" id="zzzsTags" hidden></div>
  </div>

  <div class="panel">
    <div class="summary" id="summary"></div>
    <div class="main">
      <div class="side" id="side"></div>
      <div class="list">
        <div class="search">
          <span>🔍</span>
          <input id="keyword" placeholder="输入学校名称搜索">
          <button type="button" class="chip" id="projectViewBtn">按项目看</button>
        </div>
        <div id="list" class="scroll-area"></div>
      </div>
    </div>
  </div>
  </div>

  <div class="view" id="view-scores" hidden>
    <div class="panel">
      <div class="seg" id="scoreBatch">
        <button data-v="mee" class="active">名额分配</button>
        <button data-v="batch1">第一批</button>
        <button data-v="batch2">第二批</button>
        <button data-v="second">二次划线</button>
        <button data-v="batch3">第三批</button>
      </div>
      <button type="button" class="fold-bar" id="scoreFoldToggle" aria-expanded="false" aria-controls="scoreFold">
        <span class="label" id="scoreFoldLabel">筛选与说明</span>
        <span class="hint" id="scoreFoldHint">展开</span>
        <span class="arrow">›</span>
      </button>
      <div id="scoreFold" hidden>
      <div class="score-note-wrap" id="scoreNoteWrap">
        <button type="button" class="score-note-toggle" id="scoreNoteToggle" aria-expanded="false">
          <span class="label" id="scoreNoteLabel">说明与原图</span>
          <span class="hint" id="scoreNoteHint">展开</span>
          <span class="arrow">›</span>
        </button>
        <div class="score-note" id="scoreNote"></div>
      </div>
      <div class="filters" id="scoreFilters">
        <select id="scoreType"></select>
        <select id="scoreCategory">
          <option value="">全部类别</option>
          <option value="AC">AC类</option>
          <option value="D">D类</option>
          <option value="ACD">ACD类</option>
        </select>
        <select id="scoreDistrict"><option value="">全部区域</option></select>
        <select id="scoreBoarding"><option value="">住宿不限</option></select>
        <select id="scoreSort"></select>
        <input id="scoreMy" type="number" inputmode="numeric" placeholder="我的中考分">
        <label class="reach-check"><input id="scoreOnlyReach" type="checkbox">只看达到我的分数</label>
      </div>
      <div class="filter-tags" id="scoreTags" hidden></div>
      </div>
    </div>
    <div class="panel" id="scorePanel">
      <div class="summary" id="scoreSummary"></div>
      <div class="main">
        <div class="side" id="scoreSide"></div>
        <div class="list">
          <div class="search">
            <span>🔍</span>
            <input id="scoreKeyword" placeholder="输入学校名称搜索">
          </div>
          <div id="scoreList" class="scroll-area"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="view" id="view-fee" hidden>
    <div class="panel">
      <h2>公办普通高中收费标准（政府定价）</h2>
      <div id="feeStandard"></div>
    </div>
    <div class="panel">
      <div class="seg" id="feeOwnership">
        <button data-v="" class="active">全部</button>
        <button data-v="公办">公办</button>
        <button data-v="民办">民办</button>
      </div>
      <div class="filters">
        <select id="feeType"></select>
        <select id="feeDistrict"><option value="">全部区域</option></select>
        <select id="feeSort">
          <option value="tuition-asc">学费从低到高</option>
          <option value="tuition-desc">学费从高到低</option>
          <option value="name">按名称</option>
          <option value="total3-asc">三年学费含住宿从低到高</option>
          <option value="total3-desc">三年学费含住宿从高到低</option>
        </select>
        <input id="feeMy" type="number" inputmode="numeric" placeholder="我的中考分">
      </div>
      <div class="filter-tags" id="feeTags" hidden></div>
    </div>
    <div class="panel">
      <div class="summary" id="feeSummary"></div>
      <div class="search">
        <span>🔍</span>
        <input id="feeKeyword" placeholder="输入学校名称搜索">
      </div>
      <div id="feeList"></div>
    </div>
  </div>

  <footer id="footer"></footer>
  <div id="compareDock" class="compare-dock" hidden></div>
</div>

<div class="rules-mask" id="rulesMask">
  <div class="rules" role="dialog" aria-modal="true" aria-labelledby="rulesTitle">
    <div class="rules-head">
      <span id="rulesTitle">名称与规则说明</span>
      <button id="closeRules" aria-label="关闭">×</button>
    </div>
    <div class="rules-body" id="rulesBody"></div>
  </div>
</div>

<script src="data/zzzs-data.js"></script>
<script src="data/scores-data.js"></script>
<script src="js/app.js"></script>
<script src="js/rules.js"></script>
</body>
</html>
