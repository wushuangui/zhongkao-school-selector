name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site/data _site/css _site/js
          cp self-recruitment/index.html _site/
          cp self-recruitment/css/style.css _site/css/
          cp self-recruitment/js/app.js _site/js/
          cp self-recruitment/js/guide.js _site/js/
          cp self-recruitment/js/rules.js _site/js/
          cp self-recruitment/data/zzzs-data.js _site/data/
          cp self-recruitment/data/scores-data.js _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
