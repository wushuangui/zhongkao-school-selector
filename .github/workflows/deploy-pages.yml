name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 发版步骤见 docs/runbook-data-release.md（监测→抓取→QA→发布→回滚）
      - name: Check FAQ shares rules
        run: python self-recruitment/scripts/check_faq_rules.py
      - name: Check score schema and school links
        run: |
          python self-recruitment/scripts/check_score_schema.py
          python self-recruitment/scripts/check_school_links.py
          python self-recruitment/scripts/check_reco_fixtures.py
      - name: Prepare site
        run: |
          mkdir -p _site/data _site/css _site/js
          cp self-recruitment/index.html _site/
          cp self-recruitment/css/style.css _site/css/
          cp self-recruitment/js/app.js _site/js/
          cp self-recruitment/js/changelog.js _site/js/
          cp self-recruitment/js/guide.js _site/js/
          cp self-recruitment/js/timeline.js _site/js/
          cp self-recruitment/js/rules-data.js _site/js/
          cp self-recruitment/js/rules.js _site/js/
          cp self-recruitment/js/reco.js _site/js/
          cp self-recruitment/data/zzzs-data.js _site/data/
          cp self-recruitment/data/scores-meta.js _site/data/
          cp self-recruitment/data/scores-batch-*.js _site/data/
          cp self-recruitment/data/mapping-data.js _site/data/
          cp self-recruitment/data/timeline-data.js _site/data/
          cp self-recruitment/data/changelog-data.js _site/data/
          cp self-recruitment/data/timeline-2026.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
